  name: tropical-voyage
spec:
  dataPrompt: |
    @snail rides on @whale's tail as they swim through a tropical ocean, an active volcano in the background, two dolphins jump once, a monkey watches from a palm tree on a nearby island, warm golden sunlight, photorealistic style
  dataPromptNegative: dark, scary, blurry, low quality, cartoon, anime, many dolphins, pod of dolphins, background music, soundtrack, musical score
  shots:
    - name: riding-together
      dataPrompt: |
        Shot 1 (5s): Underwater medium close-up, 50mm lens, camera 2m below surface tracking alongside @whale. @snail clings to @whale's tail fluke as @whale glides with powerful strokes. Late-afternoon sunlight pierces the water, casting caustics on @whale's blue-grey skin. Bubbles trail from @whale's blowhole. Clear turquoise water, plankton in light beams. Camera keeps pace. Shallow DOF — @snail sharp, background fades to deep blue. SFX: muffled underwater ambiance, whale song, water rush. No music.
      dataPromptNegative: ''
      duration: 5
    - name: dolphins-and-volcano
      dataPrompt: |
        Shot 2 (5s): Split-level waterline shot, lens half submerged. Below: @whale glides submerged at 3m depth with @snail on its tail, visible through clear water with light refractions on sandy floor. Above: two dolphins arc in a synchronised leap, grey skin catching golden-hour sun, droplets mid-air. Background: dark conical volcano with smoke from crater, jungle at base. Camera static at water level. SFX: dolphin splashes, distant volcanic rumble, wave lapping. No music.
      dataPromptNegative: ''
      duration: 5
    - name: monkey-on-island
      dataPrompt: |
        Shot 3 (5s): Wide shot, camera elevated 10m, slow push-in toward a tropical island. Coconut palm leans over turquoise shallows — on its lowest frond a capuchin monkey grips the branch, head tilted, watching the sea. Mid-ground: @whale's silhouette glides beneath the glassy surface with @snail on tail, wake trailing. Volcano on horizon, smoke column lit orange-pink by setting sun. Golden-hour light, long shadows on white sand. Camera dollies forward. SFX: monkey chitter, hornbill, rustling palms, lapping waves. No music.
      dataPromptNegative: ''
      duration: 5
