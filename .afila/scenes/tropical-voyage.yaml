spec:
  dataPrompt: |
    @snail rides on @whale's tail as they swim through a tropical ocean, an active volcano in the background, two dolphins jump once, a monkey watches from a palm tree on a nearby island, warm golden sunlight, photorealistic style
  dataPromptNegative: dark, scary, blurry, low quality, cartoon, anime, many dolphins, pod of dolphins, background music, soundtrack, musical score
  shots:
    - name: riding-together
      dataPrompt: |
        Shot 1 (5s): Underwater medium close-up, 50mm lens equivalent, camera positioned 2 meters below the ocean surface tracking laterally alongside @whale. @snail clings to the broad flat surface of @whale's tail fluke as @whale glides forward with slow, powerful strokes. Shafts of late-afternoon sunlight pierce the water from above, casting rippling caustic patterns across @whale's dark blue-grey skin. Tiny air bubbles trail from @whale's blowhole. The water is crystal-clear turquoise with visible plankton particles drifting in the light beams. Camera drifts gently with the ocean current, maintaining pace with the pair. Depth of field keeps @snail and the tail sharp while the open ocean behind softens into deep blue. SFX: muffled underwater ambiance, low resonant whale song reverberating through the water, soft rush of water flowing over @whale's body. No background music.
      dataPromptNegative: ''
      duration: 5
    - name: dolphins-and-volcano
      dataPrompt: |
        Shot 2 (5s): Split-level half-underwater shot, lens half submerged at the waterline. Below the surface, @whale glides fully submerged at 3 meters depth with @snail on its tail, visible through gin-clear water with light refractions dancing on the sandy floor. Above the waterline, two bottlenose dolphins arc in a synchronised leap, wet grey skin catching golden-hour sunlight, droplets scattering mid-air before splashing back down. Background reveals a dark conical volcanic peak with ash-grey smoke billowing from its crater, lush jungle at its base. Camera holds static, letting action play in both halves of the frame. SFX: dolphin splashes, distant volcanic rumble, gentle wave lapping. No background music.
      dataPromptNegative: ''
      duration: 5
    - name: monkey-on-island
      dataPrompt: |
        Shot 3 (5s): Wide establishing shot, camera elevated 10 meters on a slow push-in toward a small tropical island. A coconut palm leans over turquoise shallows in the left foreground — perched on its lowest frond a capuchin monkey grips the branch, head tilted, watching the ocean with alert dark eyes. In the mid-ground, @whale's dark silhouette glides just beneath the glassy surface with @snail on its tail, a faint wake trailing behind. The volcanic island looms on the distant horizon, its smoke column lit orange-pink by the setting sun. Golden-hour light bathes the scene, long shadows on white sand. Camera dollies forward over 5 seconds. SFX: monkey chittering, distant hornbill call, rustling palm fronds, waves lapping shore. No background music.
      dataPromptNegative: ''
      duration: 5
