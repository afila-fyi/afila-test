  name: tropical-voyage
spec:
  dataPrompt: |
    @snail rides on @whale's tail as they swim through a tropical ocean, an active volcano in the background, two dolphins jump once, a monkey watches from a palm tree on a nearby island, warm golden sunlight, photorealistic style
  dataPromptNegative: dark, scary, blurry, low quality, cartoon, anime, many dolphins, pod of dolphins, background music, soundtrack, musical score
  shots:
    - name: riding-together
      dataPrompt: |
        Shot 1 (5s): Underwater medium close-up, 50mm lens equivalent, camera positioned 2 meters below the ocean surface tracking laterally alongside @whale. @snail clings to the broad flat surface of @whale's tail fluke as @whale glides forward with slow, powerful strokes. Shafts of late-afternoon sunlight pierce the water from above, casting rippling caustic patterns across @whale's dark blue-grey skin. Tiny air bubbles trail from @whale's blowhole. The water is crystal-clear turquoise with visible plankton particles drifting in the light beams. Camera drifts gently with the ocean current, maintaining pace with the pair. Depth of field keeps @snail and the tail sharp while the open ocean behind softens into deep blue. SFX: muffled underwater ambiance, low resonant whale song reverberating through the water, soft rush of water flowing over @whale's body. No background music.
      dataPromptNegative: ''
      duration: 5
    - name: dolphins-and-volcano
      dataPrompt: |
        Shot 2 (5s): Split-level half-underwater shot, camera at the waterline with the lens half submerged. Below the surface, @whale glides fully submerged at 3 meters depth, body angled slightly downward, with @snail still perched on its tail — both visible through gin-clear tropical water with dancing light refractions on the sandy ocean floor below. Above the waterline in the same frame, two bottlenose dolphins arc out of the water in a single synchronised leap, their wet grey skin catching the golden-hour sunlight, droplets scattering mid-air, before splashing back down cleanly. The background above water reveals a volcanic island — a dark conical peak with a thick column of ash-grey smoke billowing from its crater, surrounded by lush green jungle at its base. Camera holds static at water level, letting the action play out in both halves of the frame. SFX: dolphin splashes breaking the surface, distant deep volcanic rumble, gentle lapping of waves against the camera perspective. No background music.
      dataPromptNegative: ''
      duration: 5
    - name: monkey-on-island
      dataPrompt: |
        Shot 3 (5s): Wide establishing shot, camera elevated 10 meters above sea level on a slow push-in toward a small lush tropical island. A coconut palm leans out over the turquoise shallows in the left foreground, and perched on its lowest frond a small brown capuchin monkey grips the branch with one hand, head tilted, watching the ocean with alert dark eyes. In the mid-ground water behind the island, @whale's dark silhouette glides just beneath the glassy surface with @snail visible as a small shape on its tail, a faint wake trailing behind. The volcanic island looms on the distant horizon to the right, its smoke column lit orange-pink by the setting sun. The entire scene is bathed in warm golden-hour light, long shadows stretching across the island's white sand beach. Camera slowly dollies forward, tightening the composition over 5 seconds. SFX: capuchin monkey chittering, tropical bird calls — a distant hornbill, rustling palm fronds in a light breeze, gentle waves lapping the shore. No background music.
      dataPromptNegative: ''
      duration: 5
