type: scene
metadata:
  name: ensemble-ten
spec:
  dataPrompt: |
    The maximum of ten reference images in one scene: the five characters @hero, @nutkin, @sidekick, @snail and @whale, plus the five stills @hero-and-sidekick-park, @park-adventure, @portrait-hero, @keyframe-start and @keyframe-end as style and location references. A cheerful parade through the park; keep every character recognisable.
  dataPromptNegative: dark, scary, blurry, low quality, background music, soundtrack, subtitles, captions
  shots:
    - name: parade
      dataPrompt: |
        Shot 1 (8s): Wide shot, @hero leads @sidekick, @nutkin and @snail along the park path while @whale floats above on a balloon-like cloud, in the look of @park-adventure and @hero-and-sidekick-park. SFX: cheerful footsteps, birdsong. No background music.
      dataPromptNegative: ''
      duration: 8
  options:
    duration: 8
    aspectRatio: '16:9'
    resolution: 480p
