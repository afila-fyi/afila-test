        Shot 1 (5s): Wide shot, @hero and @sidekick arrive at the shore of the park lake, @nutkin waves from a branch, @snail sits on a rock. @whale surfaces in the water behind them. SFX: ambient lake sounds, birds. No background music.
      dataPromptNegative: ''
      duration: 5
    - name: celebration
      dataPrompt: |
        Shot 2 (5s): Medium shot, everyone cheers together, @hero says "We made it, all of us!", @sidekick barks, @whale blows a gentle spout. SFX: cheering, splash, bark. No background music.
      dataPromptNegative: ''
      duration: 5
