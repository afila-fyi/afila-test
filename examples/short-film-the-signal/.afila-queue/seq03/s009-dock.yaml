type: scene
metadata:
  name: s009-dock
spec:
  dataPrompt: |
    Calm dawn at the stone dock below the lighthouse, pink and gold light, @tomas beside his boat. ligne claire cartoon style, clean bold outlines, flat cel-shaded colors. Cinematic, slow camera.
  dataPromptNegative: dark, scary, blurry, low quality, text overlays, watermark, subtitles, background music
  shots:
    - name: wide
      dataPrompt: |
        Shot 1 (4s): Hard cut to the next morning, wide shot of @dock-dawn, the storm gone, calm gold sea, the battered boat moored. SFX: gentle waves, gulls. No background music.
      dataPromptNegative: ''
      duration: 4
    - name: tomas-rope
      dataPrompt: |
        Shot 2 (4s): Medium shot, @tomas in his green oilskin jacket and black sailor cap, tired, ties the mooring rope to a post and looks up at the lighthouse. SFX: gentle waves, gulls, rope creaking. No background music.
      dataPromptNegative: ''
      duration: 4
  keyframes:
    first: dock-dawn
  options:
    duration: 8
    aspectRatio: '16:9'
    resolution: 480p
status:
  success: false
