type: scene
metadata:
  name: s010-balcony
spec:
  dataPrompt: |
    Calm dawn on the lighthouse balcony, pink and gold light, @maya in her bright yellow raincoat at the railing. ligne claire cartoon style, clean bold outlines, flat cel-shaded colors. Cinematic, slow camera.
  dataPromptNegative: dark, scary, blurry, low quality, text overlays, watermark, subtitles, background music
  shots:
    - name: balcony
      dataPrompt: |
        Shot 1 (4s): Wide shot of @lighthouse-dawn, @maya in her bright yellow raincoat steps onto the balcony with a steaming mug and rests her hands on the railing. SFX: gentle waves, gulls. No background music.
      dataPromptNegative: ''
      duration: 4
    - name: sees-him
      dataPrompt: |
        Shot 2 (4s): Medium shot, @maya in her bright yellow raincoat looks down toward the dock, then smiles and raises her mug in greeting. SFX: gentle waves, gulls. No background music.
      dataPromptNegative: ''
      duration: 4
  keyframes:
    first: lighthouse-dawn
  options:
    duration: 8
    aspectRatio: '16:9'
    resolution: 360p
status:
  success: false
